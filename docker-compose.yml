version: "3.8"
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: streetchat
      POSTGRES_USER: streetchat
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streetchat"]
      interval: 5s
      timeout: 3s
      retries: 5
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://streetchat:devpassword@db:5432/streetchat
      - FEATHERLESS_API_KEY=${FEATHERLESS_API_KEY:-}
      - FEATHERLESS_BASE_URL=${FEATHERLESS_API_KEY:-https://api.featherless.ai/v1}
      - MODEL_NAME=${MODEL_NAME:-RoseG/StreetChat-v1.36}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-dev-admin-key}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - EMBEDDINGS_ENABLED=${EMBEDDINGS_ENABLED:-true}
      - RISK_THRESHOLD=${RISK_THRESHOLD:-70}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata: