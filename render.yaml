services:
  - type: web
    name: streetchat
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: FEATHERLESS_BASE_URL
        sync: false
      - key: MODEL_NAME
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: EMBEDDINGS_ENABLED
        sync: false
      - key: RISK_THRESHOLD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: streetchat-db
          property: connectionString
databases:
  - name: streetchat-db
    databaseName: streetchat
    user: streetchat
    plan: standard