<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>StreetChat — help, resources, someone to talk to</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span>StreetChat</div>
    <div class="auth-chip">
      <span id="whoPill" class="pill">Anonymous · no memory</span>
      <button id="authBtn" class="btn ghost">Sign in</button>
    </div>
  </header>

  <main id="chat" class="chat" aria-live="polite"></main>

  <form id="composer" class="composer">
    <button type="button" id="attachBtn" class="iconbtn" title="Send a photo">📷</button>
    <input type="file" id="fileInput" accept="image/*" hidden />
    <textarea id="messageInput" rows="1" placeholder="Message StreetChat…"></textarea>
    <button type="submit" id="sendBtn" class="send">Send</button>
  </form>

  <dialog id="authModal" class="modal">
    <div class="modal-head">
      <div class="tabs">
        <button class="tab active" data-tab="signin">Sign in</button>
        <button class="tab" data-tab="signup">Create account</button>
        <button class="tab" data-tab="recover">Forgot password</button>
      </div>
      <button id="authClose" class="iconbtn" type="button">✕</button>
    </div>

    <section class="tabpane" data-pane="signin">
      <p class="hint">With an account, StreetChat remembers you across visits and text messages.</p>
      <input id="loginUser" placeholder="Username" autocomplete="username" />
      <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="loginSubmit" class="btn primary" type="button">Sign in</button>
      <p class="err" id="loginErr"></p>
    </section>

    <section class="tabpane hidden" data-pane="signup">
      <input id="regUser" placeholder="Pick a username" />
      <input id="regPass" type="password" placeholder="Pick a password (4+ characters)" />
      <input id="regQ" placeholder="Recovery question — e.g. Street I grew up on" />
      <input id="regA" placeholder="Recovery answer" />
      <p class="hint">No email or phone needed. Your recovery answer is your way back in if you forget the password.</p>
      <button id="regSubmit" class="btn primary" type="button">Create account</button>
      <p class="err" id="regErr"></p>
    </section>

    <section class="tabpane hidden" data-pane="recover">
      <input id="recUser" placeholder="Your username" />
      <button id="recStart" class="btn" type="button">Continue</button>
      <div id="recStep2" class="hidden">
        <p id="recQuestion" class="hint"></p>
        <input id="recAnswer" placeholder="Your answer" />
        <input id="recPass" type="password" placeholder="New password" />
        <button id="recFinish" class="btn primary" type="button">Reset password</button>
      </div>
      <p class="err" id="recErr"></p>
    </section>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
